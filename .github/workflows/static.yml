# Action versions checked against each project's releases API on 2026-09-20
# and pinned to the major: checkout v7.0.1, configure-pages v6.0.0,
# upload-pages-artifact v5.0.0, deploy-pages v5.0.1.
#
# upload-pages-artifact v5 also clears the "Node.js 20 is deprecated" warning:
# v3 wrapped actions/upload-artifact@v4, a Node 20 action the runner was
# forcing onto Node 24. v5 wraps upload-artifact v7.

# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Stage Sources
        run: |
          mkdir output
          cd output
          tar xvzf ../github-pages.tar.gz
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: 'output'
          # Already the action's default and the shortest GitHub permits.
          # Stated explicitly because expiry is easy to blame and was not the
          # cause: artifacts here did expire on schedule, and expired
          # artifacts keep counting against the account's storage quota until
          # they are deleted. Shortening retention cannot help; deleting can.
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
